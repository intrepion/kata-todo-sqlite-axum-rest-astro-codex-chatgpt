name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    name: Rust compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Compile all targets and run available tests
        run: cargo +stable test --locked --all-targets
  web:
    name: Astro production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
